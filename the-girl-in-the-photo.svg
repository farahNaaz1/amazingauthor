<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPhoto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121114"/>
      <stop offset="50%" stop-color="#241d22"/>
      <stop offset="100%" stop-color="#0a090b"/>
    </linearGradient>
    <filter id="photoGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#bgPhoto)"/>

  <!-- Ornate Frame -->
  <rect x="25" y="25" width="550" height="850" fill="none" stroke="#b8934a" stroke-width="1.2" opacity="0.45"/>
  <rect x="35" y="35" width="530" height="830" fill="none" stroke="#7d2235" stroke-width="1" opacity="0.3"/>

  <!-- Vintage Polaroid Frame in Center -->
  <g transform="translate(140, 240) rotate(-2)">
    <rect x="-10" y="-10" width="340" height="400" fill="#f4efe6" rx="3" filter="drop-shadow(0px 15px 25px rgba(0,0,0,0.8))"/>
    <!-- Photo Window -->
    <rect x="15" y="15" width="290" height="290" fill="#181519"/>
    <!-- Eerie Face Silhouette -->
    <circle cx="160" cy="140" r="55" fill="#2b242a"/>
    <path d="M 105 285 C 110 200 210 200 215 285 Z" fill="#221c21"/>
    <!-- Cracked Glass on Photo -->
    <path d="M 60 40 L 160 140 L 250 80 M 160 140 L 130 260 M 160 140 L 220 230" stroke="#f4efe6" stroke-width="1.2" opacity="0.75" fill="none"/>
    <!-- Pale glowing eyes -->
    <circle cx="145" cy="135" r="2.5" fill="#c5a059" opacity="0.8"/>
    <circle cx="175" cy="135" r="2.5" fill="#c5a059" opacity="0.8"/>
    <!-- Polaroid caption note -->
    <text x="160" y="350" font-family="'Courier New', monospace" font-size="14" fill="#3a3035" text-anchor="middle" font-weight="bold">DO NOT LOOK BACK</text>
  </g>

  <!-- Title section -->
  <text x="300" y="100" font-family="'Cinzel', serif" font-size="13" letter-spacing="6" fill="#c5a059" text-anchor="middle">A PSYCHOLOGICAL HORROR STORY</text>
  <line x1="200" y1="115" x2="400" y2="115" stroke="#c5a059" stroke-width="0.8" opacity="0.5"/>

  <text x="300" y="170" font-family="'Playfair Display', Georgia, serif" font-size="28" letter-spacing="4" fill="#d9d2c9" text-anchor="middle">THE</text>
  <text x="300" y="215" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#f0ebe1" text-anchor="middle">GIRL IN THE PHOTO</text>

  <!-- Tagline / Author -->
  <text x="300" y="730" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#a89fa4" text-anchor="middle">“A frozen smile hides a thousand unspoken screams.”</text>

  <rect x="170" y="780" width="260" height="44" fill="#1c161b" rx="3" stroke="#b8934a" stroke-width="1"/>
  <text x="300" y="808" font-family="'Cinzel', Georgia, serif" font-size="15" letter-spacing="4" fill="#ffffff" text-anchor="middle" font-weight="700">BIDISHA BHATTACHARYYA</text>
</svg>
