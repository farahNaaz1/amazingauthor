<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKidnap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19060B"/>
      <stop offset="60%" stop-color="#3A0D18"/>
      <stop offset="100%" stop-color="#0E0306"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bgKidnap)"/>
  <rect x="25" y="25" width="550" height="850" fill="none" stroke="#C5A059" stroke-width="1.2" opacity="0.6"/>

  <!-- Dramatic Gothic Arch & Silhouette -->
  <g transform="translate(300, 420)">
    <!-- Arch -->
    <path d="M -110 160 L -110 -20 C -110 -110 0 -170 0 -170 C 0 -170 110 -110 110 -20 L 110 160 Z" fill="#24070F" stroke="#C5A059" stroke-width="1.5"/>
    <!-- Couple Silhouette in Dramatic embrace -->
    <circle cx="-15" cy="-25" r="24" fill="#0E0306"/>
    <circle cx="20" cy="-35" r="28" fill="#0E0306"/>
    <path d="M -45 130 C -45 40 45 30 55 130 Z" fill="#0E0306"/>
    <!-- Red Rose Petals floating -->
    <ellipse cx="-70" cy="50" rx="9" ry="5" fill="#C51D3A" transform="rotate(35 -70 50)"/>
    <ellipse cx="65" cy="80" rx="7" ry="4" fill="#C51D3A" transform="rotate(-25 65 80)"/>
    <ellipse cx="-20" cy="110" rx="8" ry="4" fill="#C51D3A" transform="rotate(15 -20 110)"/>
  </g>

  <text x="300" y="120" font-family="'Cinzel', serif" font-size="12" letter-spacing="6" fill="#C5A059" text-anchor="middle">A MAFIA ROMANCE & SUSPENSE SERIES</text>
  <line x1="200" y1="135" x2="400" y2="135" stroke="#C5A059" stroke-width="0.8" opacity="0.6"/>

  <text x="300" y="210" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="800" fill="#FAF7F2" text-anchor="middle" letter-spacing="3">KIDNAPPED</text>
  <text x="300" y="255" font-family="'Cinzel', serif" font-size="16" letter-spacing="5" fill="#D4AF37" text-anchor="middle">THE COMPLETE SAGA</text>

  <text x="300" y="680" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#E8DFC8" text-anchor="middle">“When the captor becomes the only sanctuary in a burning world.”</text>

  <rect x="170" y="770" width="260" height="46" fill="#150308" rx="3" stroke="#C5A059" stroke-width="1.2"/>
  <text x="300" y="799" font-family="'Cinzel', Georgia, serif" font-size="15" letter-spacing="4" fill="#FFFFFF" text-anchor="middle" font-weight="700">BIDISHA BHATTACHARYYA</text>
</svg>
