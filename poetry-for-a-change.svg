<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPoetry" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1817"/>
      <stop offset="60%" stop-color="#2D2723"/>
      <stop offset="100%" stop-color="#141211"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bgPoetry)"/>
  <rect x="25" y="25" width="550" height="850" fill="none" stroke="#C5A059" stroke-width="1.2" opacity="0.6"/>

  <!-- Celestial Sun & Crescent Moon Artwork -->
  <g transform="translate(300, 420)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="5,4"/>
    <circle cx="0" cy="0" r="75" fill="#241E1A"/>
    <!-- Crescent Moon in Gold -->
    <path d="M 10 -60 A 60 60 0 0 0 10 60 A 45 45 0 0 1 10 -60 Z" fill="#D4AF37"/>
    <!-- Radiating Starlight rays -->
    <line x1="0" y1="-115" x2="0" y2="-95" stroke="#C5A059" stroke-width="2"/>
    <line x1="0" y1="115" x2="0" y2="95" stroke="#C5A059" stroke-width="2"/>
    <line x1="-115" y1="0" x2="-95" y2="0" stroke="#C5A059" stroke-width="2"/>
    <line x1="115" y1="0" x2="95" y2="0" stroke="#C5A059" stroke-width="2"/>
  </g>

  <text x="300" y="120" font-family="'Cinzel', serif" font-size="12" letter-spacing="6" fill="#C5A059" text-anchor="middle">CONTEMPORARY VERSE & REFLECTION</text>
  <line x1="200" y1="135" x2="400" y2="135" stroke="#C5A059" stroke-width="0.8" opacity="0.6"/>

  <text x="300" y="210" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#FAF7F2" text-anchor="middle">Poetry For A Change</text>
  <text x="300" y="255" font-family="'Cinzel', serif" font-size="15" letter-spacing="4" fill="#D4AF37" text-anchor="middle">AN INDEPENDENT COLLECTION</text>

  <text x="300" y="680" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#E8DFC8" text-anchor="middle">“Words that shift the compass of the spirit.”</text>

  <rect x="170" y="770" width="260" height="46" fill="#1A1817" rx="3" stroke="#C5A059" stroke-width="1.2"/>
  <text x="300" y="799" font-family="'Cinzel', Georgia, serif" font-size="15" letter-spacing="4" fill="#FFFFFF" text-anchor="middle" font-weight="700">BIDISHA BHATTACHARYYA</text>
</svg>
