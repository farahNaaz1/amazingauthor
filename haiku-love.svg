<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHaiku" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="60%" stop-color="#F3ECE0"/>
      <stop offset="100%" stop-color="#EADBCE"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bgHaiku)"/>

  <!-- Delicate inner border -->
  <rect x="30" y="30" width="540" height="840" fill="none" stroke="#C5A059" stroke-width="1.2" opacity="0.6"/>
  <rect x="42" y="42" width="516" height="816" fill="none" stroke="#7D2235" stroke-width="0.75" opacity="0.4"/>

  <!-- Red Japanese-style Author Seal / Stamp -->
  <rect x="470" y="70" width="45" height="45" fill="#7D2235" rx="3"/>
  <text x="492" y="100" font-family="'Cinzel', serif" font-size="16" fill="#FAF6F0" text-anchor="middle" font-weight="bold">詩</text>

  <!-- Botanical branch illustration -->
  <g transform="translate(180, 260)" stroke="#7D2235" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 120 220 Q 80 150 140 70 T 110 -20"/>
    <path d="M 100 160 Q 60 140 40 150"/>
    <path d="M 130 110 Q 170 90 200 110"/>
    <path d="M 125 50 Q 80 30 70 50"/>
    
    <!-- Leaves / Blossoms in Muted Gold -->
    <ellipse cx="40" cy="150" rx="9" ry="5" fill="#C5A059" stroke="none" transform="rotate(-20 40 150)"/>
    <ellipse cx="200" cy="110" rx="9" ry="5" fill="#C5A059" stroke="none" transform="rotate(30 200 110)"/>
    <ellipse cx="70" cy="50" rx="8" ry="4.5" fill="#C5A059" stroke="none" transform="rotate(-35 70 50)"/>
    <ellipse cx="110" cy="-20" rx="8" ry="5" fill="#C5A059" stroke="none" transform="rotate(15 110 -20)"/>
  </g>

  <!-- Delicate Haiku Verse on Cover -->
  <g text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="19" font-style="italic" fill="#581825" opacity="0.9">
    <text x="300" y="470">words adrift in rain,</text>
    <text x="300" y="505">silence writes what lips conceal,</text>
    <text x="300" y="540">love remains behind.</text>
  </g>

  <!-- Header -->
  <text x="300" y="120" font-family="'Cinzel', serif" font-size="12" letter-spacing="6" fill="#8C6B2D" text-anchor="middle">A MICRO-POETRY COLLECTION</text>
  <line x1="220" y1="135" x2="380" y2="135" stroke="#C5A059" stroke-width="0.8" opacity="0.6"/>

  <!-- Titles -->
  <text x="300" y="195" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#581825" text-anchor="middle">Haiku Love</text>
  <text x="300" y="235" font-family="'Cinzel', serif" font-size="14" letter-spacing="4" fill="#C5A059" text-anchor="middle" font-weight="600">LOST IN THOUGHTS</text>

  <!-- Bottom author mark -->
  <line x1="240" y1="730" x2="360" y2="730" stroke="#C5A059" stroke-width="1" opacity="0.5"/>
  <text x="300" y="780" font-family="'Cinzel', Georgia, serif" font-size="15" letter-spacing="5" fill="#3D0B17" text-anchor="middle" font-weight="700">BIDISHA BHATTACHARYYA</text>
  <text x="300" y="810" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#8C6B2D" text-anchor="middle">POET & AUTHOR</text>
</svg>
